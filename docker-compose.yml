version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# SyncMesh — Full local development stack
# Run: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure: PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: syncmesh-postgres
    environment:
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB:       maindb
    # Enable logical replication via server flags
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=5
        -c max_wal_senders=5
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d maindb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Infrastructure: Zookeeper (required by Kafka < KRaft mode) ───────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: syncmesh-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    healthcheck:
      test: ["CMD", "echo", "ruok"]
      interval: 10s
      retries: 5

  # ── Infrastructure: Kafka ─────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: syncmesh-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_LOG_RETENTION_HOURS:              168   # 7-day event log retention
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Infrastructure: Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: syncmesh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Infrastructure: Qdrant ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: syncmesh-qdrant
    ports:
      - "6333:6333"   # REST API + gRPC
      - "6334:6334"   # gRPC (optional)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SyncMesh: WAL Listener ────────────────────────────────────────────────
  wal-listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncmesh-wal-listener
    command: >
      python -c "
      from src.cdc.wal_listener import WALListener;
      WALListener().start()
      "
    env_file: .env
    environment:
      KAFKA_BROKER: kafka:29092   # internal Docker network address
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── SyncMesh: Sync Workers (horizontally scaled) ──────────────────────────
  sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      python -c "
      from config.settings import settings;
      from config.kafka_config import cdc_topic_for_table;
      from src.consumers.sync_worker import SyncWorker;
      tables = settings.postgres.watched_tables or ['public.customer_profiles'];
      topics = [cdc_topic_for_table(t) for t in tables];
      SyncWorker(topics).run()
      "
    env_file: .env
    environment:
      KAFKA_BROKER: kafka:29092   # internal Docker network address
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 3   # 3 workers in the same consumer group for parallelism

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  pg_data:
  qdrant_data:
